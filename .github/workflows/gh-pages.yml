name: github pages

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege by default; the deploy job widens this for itself.
permissions:
  contents: read

# A new push to a pull request cancels its older runs;
# each push to main gets its own group, so every commit there is built.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here needs the token after checkout.
          persist-credentials: false
          submodules: recursive # fetch the PaperMod theme
          fetch-depth: 0 # for .GitInfo and .Lastmod

      # Installs the Hugo version pinned in mise.toml, so CI and local match.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      # smoke depends on build, so this compiles and checks the output.
      - run: mise run smoke
        shell: bash

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  deploy:
    name: deploy
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Allow one concurrent deployment; don't cancel a run already publishing.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write # publish to GitHub Pages
      id-token: write # verify the deployment originates from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
