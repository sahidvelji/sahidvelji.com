name: github pages

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege by default; the deploy job widens this for itself.
permissions:
  contents: read

# Allow one concurrent deployment; don't cancel a run already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # fetch the PaperMod theme
          fetch-depth: 0 # for .GitInfo and .Lastmod

      # Installs the Hugo version pinned in mise.toml, so CI and local match.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Build
        run: hugo --gc --minify
      - name: Smoke-test the built page
        run: |
          fail=0
          for pattern in \
            sahid-velji.png \
            linkedin.com/in/sahidvelji \
            github.com/sahidvelji \
            kaggle.com/sahidvelji \
            x.com/sahidvelji \
            og:image; do
            grep -qF -- "$pattern" public/index.html || { echo "missing from index.html: $pattern"; fail=1; }
          done
          if grep -qE 'abs url|path_to_repo|opengraph, twitter-cards' public/index.html; then
            echo "unsubstituted theme placeholder in index.html"; fail=1
          fi
          exit $fail

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish to GitHub Pages
      id-token: write # verify the deployment originates from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
