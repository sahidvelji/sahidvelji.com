[tools]
"aqua:owenlamont/ryl" = "0.29.0"
betterleaks = "v1.10.0"
biome = "2.6.2"
hk = { version = "2.11.1", workflow = "release.yml" }
hugo = "0.169.0"
jactionlint = { version = "v2.5.0", workflow = "release.yaml" }
pkl = "0.33.0"
rumdl = "v0.3.2"
tombi = "1.11.1"
typos = "1.52.0"

[tasks.build]
description = "Build the site into public/"
run = "hugo --gc --minify"

[tasks.dev]
description = "Serve the site locally with live reload"
run = "hugo server --buildDrafts"

[tasks.lint]
description = "Run every linter in hk.pkl over the whole repo"
run = "hk check --all"

[tasks.fix]
description = "Apply every available fix from hk.pkl"
run = "hk fix --all"

[tasks.smoke]
description = "Assert the built page still renders what it should"
depends = ["build"]
run = '''
fail=0
for pattern in \
  sahid-velji.png \
  linkedin.com/in/sahidvelji \
  github.com/sahidvelji \
  kaggle.com/sahidvelji \
  x.com/sahidvelji \
  og:image; do
  grep -qF -- "$pattern" public/index.html || { echo "missing from index.html: $pattern"; fail=1; }
done
if grep -qE 'abs url|path_to_repo|opengraph, twitter-cards' public/index.html; then
  echo "unsubstituted theme placeholder in index.html"; fail=1
fi
exit $fail
'''
